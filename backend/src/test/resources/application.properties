# Tests use an in-memory H2 database (MySQL compatibility mode) - no MySQL needed.
spring.datasource.url=jdbc:h2:mem:nexzora;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.upload-dir=target/test-uploads

app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173

app.admin.email=admin@test.lk
app.admin.password=Admin@123
app.seed-demo-data=false
