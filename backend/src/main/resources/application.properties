# ---------------------------------------------------------------
# NEXZORA LMS - backend configuration
# Secrets are NOT stored here. Put them in backend/.env
# (copy .env.example -> .env). Spring loads that file below.
# ---------------------------------------------------------------
spring.application.name=nexzora-lms
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexzora_lms}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA ---
# "update" creates/updates the tables automatically. See database/schema.sql for the reference DDL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- File uploads (PDF materials) ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.upload-dir=${UPLOAD_DIR:uploads}

# --- Security ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- First admin account (created only when no admin exists) ---
app.admin.email=${ADMIN_EMAIL:admin@nexzora.lk}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-demo-data=${SEED_DEMO_DATA:true}
